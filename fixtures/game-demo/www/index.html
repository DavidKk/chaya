<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chaya 翻译测试游戏</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #101a25;
        color: #ecf2f5;
        font:
          18px/1.5 system-ui,
          sans-serif;
      }
      #scene {
        position: relative;
        width: 816px;
        height: 624px;
        margin: 18px auto;
        overflow: hidden;
        background: radial-gradient(circle at 70% 20%, #3f6478 0, #233c50 40%, #152331 100%);
        border: 1px solid #8493a2;
      }
      .skyline {
        position: absolute;
        bottom: 210px;
        width: 100%;
        height: 180px;
        background: linear-gradient(140deg, transparent 45%, #182b39 46% 55%, transparent 56%), linear-gradient(40deg, transparent 50%, #1b3342 51% 65%, transparent 66%);
        opacity: 0.8;
      }
      .title {
        position: absolute;
        top: 40px;
        left: 42px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .hint {
        position: absolute;
        top: 92px;
        left: 44px;
        color: #d5e2e8;
        font-size: 14px;
      }
      .choices {
        position: absolute;
        top: 156px;
        left: 42px;
        width: 600px;
      }
      .choice {
        width: 100%;
        margin: 5px 0;
        padding: 11px 16px;
        border: 1px solid #668398;
        border-radius: 5px;
        background: #132536d9;
        color: #fff;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }
      .choice[aria-selected='true'] {
        border-color: #9bddfa;
        background: #35627c;
        outline: 2px solid #c9f0ff;
      }
      .message {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 792px;
        height: 148px;
        padding: 18px 22px;
        border: 2px solid #b0c9d9;
        border-radius: 7px;
        background: #101b2ceb;
        white-space: pre-wrap;
      }
      .tip {
        position: absolute;
        right: 16px;
        top: 16px;
        color: #cae5f2;
        font-size: 13px;
      }
      .panel-button {
        position: absolute;
        right: 16px;
        top: 48px;
        padding: 5px 12px;
        border: 1px solid #a8cada;
        border-radius: 4px;
        background: #244b62;
        color: #fff;
        font:
          14px system-ui,
          sans-serif;
        cursor: pointer;
      }
      .rm-window {
        position: absolute;
        z-index: 5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="skyline"></div>
      <div class="title">翻訳デバッグの町</div>
      <div class="hint">↑ ↓ 選択 · Enter 会話 · ` 插件面板 · 快速切换可测试取消上一次翻译</div>
      <div class="tip" id="status">插件加载中…</div>
      <button class="panel-button" onclick="window.ChayaEdit?.ui()">插件面板</button>
      <div id="choices" class="choices" role="listbox"></div>
      <div id="message" class="message"></div>
    </div>
    <script src="game.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/plugins/ChayaLoader.js"></script>
    <script>
      window.startDemoGame()
    </script>
  </body>
</html>
