appId: app.chaya.toolkit
productName: Chaya
copyright: Copyright © 2026 DavidJones
asar: true
npmRebuild: false
# CI 打 tag 构建后由 Actions 汇总到 GitHub Release（不在此隐式 publish）
publish: null
directories:
  output: release
  buildResources: electron/assets
files:
  - package.json
  - electron/**/*
  - scripts/local-access.cjs
  # Next 跑在 extraResources/app-root；asar 内不要打生产依赖
  - '!**/node_modules/**'
  - '!**/.next/**'
  - '!**/.electron-builder/**'
  - '!**/release/**'
  - '!**/plugins/**'
  - '!**/docs/**'
  - '!**/.agents/**'
  - '!**/__tests__/**'
extraResources:
  - from: .electron-builder/app-root
    to: app-root
# pack 后补 ad-hoc（identity 为 null 时 electron-builder 不签；有正式证书时改 identity，本钩子验签通过即跳过）
afterPack: scripts/electron-after-pack.cjs
mac:
  category: public.app-category.utilities
  icon: electron/assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # 显式关闭内置签名，由 afterPack 统一 ad-hoc（避免「已损坏」）
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName} ${version}
